name: RSpec

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get -yqq install libpq-dev
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        env:
          COVERAGE: "true"
        run: npm install --legacy-peer-deps
      - name: Install Code Climate test-reporter
        run: |
          curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
          chmod +x ./cc-test-reporter
          ./cc-test-reporter before-build
      - name: Run RSpec
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
          COVERAGE: "true"
          DATABASE_URL: postgres://postgres:@localhost:5432/SoloAsana_test
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: password
          PG_HOST: /var/run/postgresql
          PG_USER: SoloAsana
          PG_PASSWORD: password
          PG_PORT: 5432
        run: |
          bundle exec rails db:setup
          bundle exec rspec
      # paambaati/codeclimate-action was archived July 2025; v9.0.0 is the final release.
      - name: Publish Coverage Report to CodeClimate
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        uses: paambaati/codeclimate-action@v9.0.0
        with:
          debug: true
          coverageLocations: |
            ${{github.workspace}}/*.resultset.json:simplecov
            ${{github.workspace}}/js-coverage/lcov.info:lcov
