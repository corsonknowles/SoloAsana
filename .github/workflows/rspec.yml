name: RSpec
on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
  # Also trigger on page_build, as well as release created events
  page_build:
  release:
    types: # This configuration does not affect the page_build event above
      - created
jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ '16' ]
        ruby: [2.7.4]  # note, must use '3.0' with quotes due to known bug
    services:
      postgres:
        image: postgres:12
        ports: ["5432:5432"]
        env:
          RAILS_ENV: test
          POSTGRES_PASSWORD: password
          PG_HOST: /var/run/postgresql
          PG_USER: SoloAsana
          PG_PASSWORD: password
          PG_PORT: 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v2
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # istanbul-instrumenter-loader@3 declares a webpack <=4 peer dep, but the
      # app is on webpack 5; it is only used under COVERAGE=true, so relax the
      # strict npm 7+ peer check rather than force a downgrade.
      - run: npm install --legacy-peer-deps
      - name: Install Chromedriver
        uses: nanasess/setup-chromedriver@master
      - name: Run RSpec with Chromedriver and System Specs
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
          DATABASE_URL: postgres://postgres:@localhost:5432/SoloAsana_test
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: password
          PG_HOST: /var/run/postgresql
          PG_USER: SoloAsana
          PG_PASSWORD: password
          PG_PORT: 5432
        run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sudo apt-get -yqq install libpq-dev

          bundle exec rails db:setup
          bundle exec rspec
      - name: Run JavaScript Tests with Coverage
        run: npm run test:coverage
      # Best-effort: CodeClimate (codeclimate.com) is an archived service, so a
      # failed coverage upload must not fail the build.
      - name: Publish Coverage Report to CodeClimate
        continue-on-error: true
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        uses: paambaati/codeclimate-action@v3.0.0
        with:
          debug: true
          coverageLocations: |
            ${{github.workspace}}/*.resultset.json:simplecov
            ${{github.workspace}}/coverage/lcov.info:lcov
