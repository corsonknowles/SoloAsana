inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false

Lint/UselessAssignment:
  Exclude:
    - 'db/seeds.rb'

Metrics/BlockLength:
  Max: 56
  AllowedMethods: ['describe', 'context']
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 25

Rails/FilePath:
  Enabled: false

# Convention over configuration
Rails/LexicallyScopedActionFilter:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 10

RSpec/ExampleLength:
  Max: 25

RSpec/LetSetup:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

Style/ClassAndModuleChildren:
  EnforcedStyle: compact
  Exclude:
    - 'config/application.rb'

# The original create_tasks migration predates the ThreeStateBooleanColumn cop
# and cannot be changed without invalidating schema history.  The boolean
# columns it created (done, section) were retrofitted with null: false and
# default: false in FixTaskBooleanNullability (20260308131225).
Rails/ThreeStateBooleanColumn:
  Exclude:
    - 'db/migrate/20170718161915_create_tasks.rb'

Style/Documentation:
  Enabled: false

Style/MixinUsage:
  Exclude:
    - 'bin/update'

Style/StringLiterals:
  EnforcedStyle: double_quotes
